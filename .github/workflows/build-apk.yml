name: Build and Release Android APK

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install

      - name: Prebuild Android project
        run: |
          cd packages/mobile
          npx expo prebuild --platform android --clean

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: false

      - name: Build Release APK
        run: |
          cd packages/mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --build-cache

      - name: Prepare Named APK
        run: |
          MOBILE_VERSION=$(node -p "require('./packages/mobile/package.json').version")
          mkdir -p dist-apk
          # If splitPerAbi is enabled, multiple APKs are generated:
          # app-arm64-v8a-release.apk, app-armeabi-v7a-release.apk, app-x86_64-release.apk, app-universal-release.apk, etc.
          # If only single APK was generated, app-release.apk is used.
          cd packages/mobile/android/app/build/outputs/apk/release
          for f in *.apk; do
            if [ -f "$f" ]; then
              # Replace 'app' prefix with 'Lyra-${MOBILE_VERSION}-android'
              outname=$(echo "$f" | sed "s/^app/Lyra-${MOBILE_VERSION}-android/")
              cp "$f" "../../../../../../../dist-apk/${outname}"
            fi
          done

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lyra-Android-Release-APK
          path: dist-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Release APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-apk/*.apk
