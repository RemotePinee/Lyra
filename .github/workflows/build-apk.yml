name: Build and Release Android APK

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.9.0

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install

      - name: Prebuild Android project
        run: |
          cd packages/mobile
          npx expo prebuild --platform android --clean

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: false
          generate-job-summary: true

      - name: Build Release APK
        run: |
          cd packages/mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --build-cache

      - name: Prepare Named APK
        run: |
          TAG_OR_BRANCH="${{ github.ref_name }}"
          VERSION="${TAG_OR_BRANCH#v}"
          mkdir -p dist-apk
          cp packages/mobile/android/app/build/outputs/apk/release/app-release.apk dist-apk/Lyra-${VERSION}-android.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lyra-Android-Release-APK
          path: dist-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Release APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-apk/*.apk
