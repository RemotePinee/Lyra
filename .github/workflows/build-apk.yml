name: Build and Release Android APK

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            name: arm64-v8a
            gradle_arg: -PreactNativeArchitectures=arm64-v8a
          - abi: armeabi-v7a
            name: armeabi-v7a
            gradle_arg: -PreactNativeArchitectures=armeabi-v7a
          - abi: x86_64
            name: x86_64
            gradle_arg: -PreactNativeArchitectures=x86_64
          - abi: universal
            name: universal
            gradle_arg: -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64
    name: build-apk (${{ matrix.name }})
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install

      - name: Prebuild Android project
        run: |
          cd packages/mobile
          npx expo prebuild --platform android --clean

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: false

      - name: Generate Official Release Keystore & Configure Signing
        run: |
          # 1. Generate dedicated release keystore using keytool provided by Java JDK
          keytool -genkeypair -v \
            -keystore packages/mobile/android/app/release.keystore \
            -alias lyra-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass lyraAppReleaseKey2026 \
            -keypass lyraAppReleaseKey2026 \
            -dname "CN=Lyra Developer, OU=Mobile, O=Lyra Studio, L=Shenzhen, ST=Guangdong, C=CN"

          # 2. Configure android/app/build.gradle to sign release builds with official keystore instead of debug.keystore
          # Also enable v1 (JAR) and v2 (Full APK Signature) signing explicitly
          node -e '
          const fs = require("fs");
          const file = "packages/mobile/android/app/build.gradle";
          let content = fs.readFileSync(file, "utf8");

          const releaseSigningBlock = "        release {\n            storeFile file(\"release.keystore\")\n            storePassword \"lyraAppReleaseKey2026\"\n            keyAlias \"lyra-release\"\n            keyPassword \"lyraAppReleaseKey2026\"\n            v1SigningEnabled true\n            v2SigningEnabled true\n        }\n";
          content = content.replace(/signingConfigs\s*\{/, "signingConfigs {\n" + releaseSigningBlock);
          // Only replace signingConfig under release block, NOT debug block
          content = content.replace(/(buildTypes\s*\{[\s\S]*?release\s*\{[\s\S]*?)signingConfig signingConfigs\.debug/, "$1signingConfig signingConfigs.release");

          const suppressBlock = "\nallprojects { tasks.withType(JavaCompile).configureEach { options.compilerArgs += [\"-nowarn\", \"-Xlint:none\"]; options.warnings = false } }\nallprojects { tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach { kotlinOptions { allWarningsAsErrors = false; freeCompilerArgs += [\"-nowarn\"] } } }\n";
          fs.writeFileSync(file, content + suppressBlock, "utf8");
          '

      - name: Build Release APK
        run: |
          cd packages/mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --build-cache ${{ matrix.gradle_arg }}

      - name: Prepare Named APK
        run: |
          ANDROID_VERSION=$(node -p "require('./packages/mobile/package.json').version")
          ROOT_DIR="$(pwd)"
          mkdir -p "${ROOT_DIR}/dist-apk"
          cd packages/mobile/android/app/build/outputs/apk/release
          for f in *.apk; do
            if [ -f "$f" ]; then
              outname="Lyra-${ANDROID_VERSION}-android-${{ matrix.abi }}-release.apk"
              cp "$f" "${ROOT_DIR}/dist-apk/${outname}"
              break
            fi
          done

      - name: Upload Single APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lyra-Android-${{ matrix.abi }}-APK
          path: dist-apk/*.apk
          if-no-files-found: error
          retention-days: 30

  publish-apk:
    needs: build-apk
    runs-on: ubuntu-latest
    name: publish-apk (release)
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-apks
          merge-multiple: true

      - name: Release APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: all-apks/*.apk
