# Weekly, grouped, and small enough to actually read.
#
# Ungrouped Dependabot on a workspace this size opens a dozen pull requests a week, which is how
# a team learns to close them unread. Grouping by kind means one PR per area, and the CI verdict
# on it is a real answer rather than a formality.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Moves together or not at all: a mismatched React/react-dom pair does not run.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      electron:
        patterns: ["electron", "electron-*", "@electron/*"]
      codemirror:
        patterns: ["@codemirror/*", "@lezer/*"]
      expo:
        patterns: ["expo", "expo-*", "react-native", "react-native-*"]
      tooling:
        patterns: ["typescript", "knip", "lefthook", "vite", "@vitejs/*"]
      # Also on its own, and for a reason the checks cannot state themselves: nothing here
      # verifies mobile at runtime. `pnpm build` covers core and desktop; mobile gets a typecheck
      # and nothing else. So a Tailwind bump that breaks every style in the app goes green.
      #
      # Which is live rather than hypothetical. Desktop is on 4.x, mobile is still on 3.x behind
      # nativewind 4.2.6 — whose peer range reads `tailwindcss: ">3.3.0"` and therefore accepts 4
      # on paper, while nativewind 4 is written against 3's engine and config format. Grouped with
      # knip and vite, that upgrade rides in on a green tick attached to four unrelated patches.
      # Alone, it is a pull request someone has to open Expo to answer.
      tailwind:
        patterns: ["tailwindcss"]
      # On its own, because a linter release is not like the others: it ships rules, and a new
      # rule is a pile of findings in code that has not changed. 1.78 → 1.80 arrived with
      # `Cannot access refs during render` and 112 errors behind it — all of them worth reading,
      # none of them the point of a Monday dependency bump. Grouped with knip and vite it held
      # four green patches hostage; alone it is a pull request that says what it actually is.
      oxlint:
        patterns: ["oxlint"]
      types:
        patterns: ["@types/*"]
    ignore:
      # Electron majors bring Chromium and Node majors with them; that is a deliberate migration,
      # not a dependency bump.
      - dependency-name: electron
        update-types: [version-update:semver-major]
      # The same rule, learned the same way. A grouped "tooling" bump arrived carrying TypeScript
      # 5.9 → 7.0 — a different compiler, written in Go — inside a pull request titled "bump the
      # tooling group with 7 updates", next to a knip patch. It broke the build.
      #
      # It is not a bad upgrade. It is a migration: someone has to read the release notes, run the
      # codemod and look at the result. Grouped with the patches, the group is only as mergeable
      # as its most disruptive member, so the safe bumps sit red for weeks waiting on the one that
      # needs an afternoon.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # React Native's version is chosen by the Expo SDK, not by npm. `expo` declares its peer
      # range for it as `*`, so nothing in the package manager objects when the two drift apart —
      # and 0.86 → 0.87, a *minor* by semver, is where they did: `@expo/metro-config` requires
      # `react-native/rn-get-polyfills`, which 0.87 deleted, so `expo export` failed outright on a
      # bump that had passed lint, typecheck and the tests on all three platforms.
      #
      # Minors are therefore off the table here; this moves when the Expo SDK moves, in that
      # migration's own pull request. Patches still come through, which is where the fixes are.
      - dependency-name: react-native
        update-types: [version-update:semver-major, version-update:semver-minor]
      # `@types/node` majors track Node's, so this one has to track `.nvmrc` rather than chase
      # latest. A bump to 26 passed lint, typecheck, build and the tests on all three platforms —
      # and it still had to be turned down, because what it breaks is the typecheck itself. The
      # 26 types declare `node:ffi`, `node:quic` and `node:vfs`, none of which exist on the Node
      # 24 this runs on:
      #
      #     import * as quic from "node:quic"   // tsc: clean
      #     node --experimental-strip-types     // ERR_UNKNOWN_BUILTIN_MODULE
      #
      # A green typecheck over an import that cannot resolve at runtime is worse than a red one.
      # This moves when `.nvmrc` moves, in the same pull request.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      #
      # `tailwindcss` is deliberately NOT here, and the reason is worth keeping, because ignoring
      # its majors is the obvious move and it is wrong. Dependabot resolves one version per
      # package across the workspace; desktop is on 4.x and mobile on 3.x, so with majors ignored
      # the only version satisfying both is a 3.x one — it proposed **downgrading desktop from
      # 4.3.3 to 3.4.19**, and the build failed on `Can't resolve 'tailwindcss'` because 4.x is
      # what the desktop stylesheet is written against. A guard that drags the package which
      # already migrated back across the line is worse than no guard. It gets a group of its own
      # instead; see `tailwind` above.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
