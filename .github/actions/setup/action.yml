# One description of "how this repo is prepared", used by every job.
#
# It exists so that the Node version, the pnpm version and the store cache are stated once. Five
# jobs each with their own copy is five places to forget when the Node version moves.
name: Setup
description: Node, pnpm and a warm store

inputs:
  electron:
    description: Install Electron's binary too. Only the build job needs it.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install
      shell: bash
      # Frozen, so a pull request cannot quietly change what is installed without changing the
      # lockfile. `--ignore-scripts` is not used: node-pty has to build for the tests to import it.
      run: pnpm install --frozen-lockfile
      env:
        ELECTRON_SKIP_BINARY_DOWNLOAD: ${{ inputs.electron == 'true' && '0' || '1' }}
