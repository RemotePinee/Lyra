# One description of "how this repo is prepared", used by every job.
#
# It exists so that the Node version, the pnpm version and the store cache are stated once. Five
# jobs each with their own copy is five places to forget when the Node version moves.
name: Setup
description: Node, pnpm and a warm store

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install
      shell: bash
      # Frozen, so a pull request cannot quietly change what is installed without changing the
      # lockfile. Scripts are allowed to run: node-pty has to build for the tests to import it.
      #
      # Electron's binary is downloaded even in jobs that only lint or typecheck, and that is
      # deliberate. Skipping it there was an optimisation that broke the e2e job: every job shares
      # one pnpm store cache keyed on the lockfile, so whichever job ran first decided whether the
      # binary was in it — and the ones that skipped the download usually won the race, leaving
      # `electron-vite preview` with "Error: Electron uninstall" and no window.
      run: pnpm install --frozen-lockfile

    - name: Ensure Electron's binary is really there
      shell: bash
      # `pnpm install` is a no-op when the store cache already satisfies the lockfile — including
      # when what got cached was a store whose Electron postinstall never ran. The lockfile has
      # not changed, so nothing re-runs, and the failure surfaces minutes later as
      # "Error: Electron uninstall" with no window. Asking the package for its path is the
      # cheapest way to find out, and rebuilding is a no-op when it is already installed.
      # `path.txt` is written by Electron's postinstall and read by everything that launches it,
      # so its absence is exactly the condition that produces "Error: Electron uninstall".
      run: |
        if ! compgen -G "node_modules/.pnpm/electron@*/node_modules/electron/path.txt" > /dev/null; then
          echo "Electron's binary is missing from the store; rebuilding."
          pnpm rebuild electron
        fi
        compgen -G "node_modules/.pnpm/electron@*/node_modules/electron/path.txt" > /dev/null
