packages:
  - "packages/*"

allowBuilds:
  # Downloads the Electron binary.
  electron: true
  # Fetches the platform-specific esbuild binary used by Vite.
  esbuild: true
  # Windows installer toolchain; not needed to develop or run the app.
  electron-winstaller: false
  # Builds the pseudo-terminal addon the terminal panel runs on. Compiled against Node here,
  # then rebuilt against Electron's ABI by the desktop package's postinstall.
  node-pty: true
  # Installs the git hook binary; the hooks are what keep lint and typecheck from being optional.
  lefthook: true
  koffi: false
  # Unpacks the workerd binary. It is what `wrangler dev` runs the registry Worker on locally,
  # so without this the platform can only be tested by deploying it.
  workerd: true

minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20260818.1'
